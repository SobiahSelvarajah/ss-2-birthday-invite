<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Invite</title>
</head>
<body>
    <main class="container">
        <!-- Image Carousel -->
        <h1 class="heading">
            Our Little Princess is turning 5!
        </h1>           
        <section class="dateText">
            <h2 class="date">
                Sunday 7th February
            </h2>
            <h2 class="time">
                1pm
            </h2>
        </section>
        <section class="locationText">
            <h2 class="address">
                14 Cherry Tree Drive, CH5 6KE
            </h2>
            <h2 class="rsvp">
                RSVP by 25th Jan
            </h2>            
        </section>
        <section class="partyDetails">
            <h2 class="name">
                Lilian's Birthday Party
            </h2>
            <p class="activities">
                Dancing, afternoon tea, arts and crafts
                <br/>
                and a royally good time!
            </p>             
        </section>
    </main>
</body>
</html>
